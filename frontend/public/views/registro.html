<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta | LSCT</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header id="menu"></header>

    <main class="container-fluid px-3 px-md-5 py-4">
        <h1>Crear cuenta</h1>
        <p>Los campos con * son obligatorios.</p>

        <form id="formularioRegistro">
            <div id="mensajeRegistro" class="d-none" role="alert"></div>

            <div class="row g-3">
                <div class="col-md-6">
                    <label for="nombreRegistro" class="form-label">Nombre completo *</label>
                    <input id="nombreRegistro" name="nombre" class="form-control" autocomplete="name" required>
                </div>

                <div class="col-md-6">
                    <label for="correoRegistro" class="form-label">Correo electrónico *</label>
                    <input id="correoRegistro" name="correo" type="email" class="form-control" autocomplete="email"
                        required>
                </div>

                <div class="col-md-6">
                    <label for="telefonoRegistro" class="form-label">Teléfono</label>
                    <input id="telefonoRegistro" name="telefono" type="tel" class="form-control" autocomplete="tel">
                </div>

                <div class="col-md-6">
                    <label for="direccionRegistro" class="form-label">Dirección</label>
                    <input id="direccionRegistro" name="direccion" class="form-control" autocomplete="street-address">
                </div>

                <div class="col-md-6">
                    <label for="claveRegistro" class="form-label">Contraseña *</label>
                    <input id="claveRegistro" name="clave" type="password" class="form-control"
                        autocomplete="new-password" required>
                </div>

                <div class="col-md-6">
                    <label for="confirmacionRegistro" class="form-label">Confirmar contraseña *</label>
                    <input id="confirmacionRegistro" name="confirmacion" type="password" class="form-control"
                        autocomplete="new-password" required>
                </div>
            </div>

            <div class="d-flex flex-wrap gap-2 mt-4">
                <button id="btnRegistrar" type="button" class="btn btn-azul">
                    Crear cuenta
                </button>
                <a href="login.html" class="btn btn-outline-secondary">
                    Volver al inicio de sesión
                </a>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/menu.js" defer></script>
</body>

</html>
