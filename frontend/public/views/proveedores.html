<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proveedores | LSCT</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header id="menu"></header>

    <main class="container-fluid px-3 px-md-5 py-4">
        <h1>Proveedores</h1>

        <div id="mensajeListado" class="alert d-none" role="status" aria-live="polite"></div>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
            <h2 class="h5 mb-0">Listado de proveedores</h2>
            <button id="btnNuevoProveedor" type="button" class="btn btn-azul">
                Nuevo proveedor
            </button>
        </div>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th scope="col">Nombre</th>
                        <th scope="col">Tipo de servicio</th>
                        <th scope="col">Contacto</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaProveedores"></tbody>
            </table>
        </div>
    </main>

    <div id="modalProveedor" class="modal fade" tabindex="-1" aria-labelledby="tituloModalProveedor">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="tituloModalProveedor" class="modal-title fs-5">Nuevo proveedor</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <form id="formularioProveedor">
                    <div class="modal-body">
                        <div id="mensajeFormulario" class="alert alert-danger d-none" role="alert"></div>
                        <p class="small text-secondary">Los campos con * son obligatorios.</p>

                        <div class="mb-3">
                            <label for="nombreProveedor" class="form-label">Nombre *</label>
                            <input id="nombreProveedor" name="nombre" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="tipoServicioProveedor" class="form-label">Tipo de servicio *</label>
                            <input id="tipoServicioProveedor" name="tipoServicio" class="form-control" required>
                        </div>

                        <p id="ayudaContacto" class="small text-secondary">
                            Indicá al menos un correo electrónico o un teléfono.
                        </p>

                        <div class="mb-3">
                            <label for="correoProveedor" class="form-label">Correo electrónico</label>
                            <input id="correoProveedor" name="correo" type="email" class="form-control"
                                aria-describedby="ayudaContacto">
                        </div>

                        <div class="mb-3">
                            <label for="telefonoProveedor" class="form-label">Teléfono</label>
                            <input id="telefonoProveedor" name="telefono" type="tel" class="form-control"
                                aria-describedby="ayudaContacto">
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>
                        <button id="btnGuardarProveedor" type="submit" class="btn btn-azul">
                            Guardar proveedor
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="modalEstado" class="modal fade" tabindex="-1" aria-labelledby="tituloModalEstado">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="tituloModalEstado" class="modal-title fs-5">Cambiar estado</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">
                    <div id="mensajeEstado" class="alert d-none" role="alert"></div>
                    <p id="textoConfirmacion"></p>
                    <p class="small text-secondary mb-0">El proveedor conservará su información.</p>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>
                    <button id="btnConfirmarEstado" type="button" class="btn btn-naranja">
                        Confirmar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/proveedores.js"></script>
    <script type="module" src="../js/menu.js"></script>
</body>

</html>
