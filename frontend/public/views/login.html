<!doctype html>
<html lang="es" data-bs-theme="light">

<head>
    <title>Login</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <div class="container-fluid p-0">
        <header>
        <!-- Menú compartido entre las vistas. -->
        <div id="menu"></div>
    </header>
        <main class="container-fluid px-3 px-md-5 py-4">
            <form action="">
                <div style="grid-template-columns: 1fr;" class="d-grid gap-1 column-gap-1">
                    <h1>Iniciar sesión</h1>
                    <div class="p-2 mb-3">
                        <label for="" class="form-label">Usuario</label>
                        <input type="text" class="form-control" name="" id="" aria-describedby="helpId"
                            placeholder="Ingresa tu usuario" required />
                    </div>
                    <div class="p-2 mb-3">
                        <label for="" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" name="" id="" aria-describedby="helpId"
                            placeholder="Ingresa tu contraseña" required />
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <input class="btn btn-azul" type="submit" value="Iniciar sesión">

                    <a class="btn btn-naranja" href="#">
                        Registrarse
                    </a>
                </div>
            </form>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../js/menu.js" defer></script>
</body>

</html>
