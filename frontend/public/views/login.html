<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | LSCT</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header id="menu"></header>

    <main class="container-fluid px-3 px-md-5 py-4">
        <div class="mx-auto" style="max-width: 500px;">
            <h1>Iniciar sesión</h1>

            <form id="formularioLogin">
                <div id="mensajeLogin" class="d-none" role="alert"></div>

                <div class="mb-3">
                    <label for="correoAcceso" class="form-label">Correo electrónico</label>
                    <input id="correoAcceso" name="correo" type="email" class="form-control" autocomplete="username"
                        required>
                </div>

                <div class="mb-3">
                    <label for="claveAcceso" class="form-label">Contraseña</label>
                    <input id="claveAcceso" name="clave" type="password" class="form-control"
                        autocomplete="current-password" required>
                </div>

                <button id="btnIniciarSesion" type="submit" class="btn btn-azul w-100">
                    Iniciar sesión
                </button>
            </form>

            <p class="mt-3">
                ¿No tenés una cuenta?
                <a href="registro.html">Registrate</a>
            </p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/menu.js"></script>
    <script type="module" src="../js/login.js"></script>
</body>

</html>
